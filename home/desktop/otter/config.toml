# ~/.config/otter-launcher/config.toml
# One-line command prompt for niri, opened by Mod+Slash in Foot (rs.ivy.otter).
# Commands open their own windows; unmatched input falls through to fsel.

[general]
height = 1
default_module = "s"   # unmatched input -> fsel with the text pre-filled
empty_module = "s"     # Enter on empty input -> fsel
exec_cmd = "sh -c"

[interface]
header = ""
suggestion_mode = "hint"
separator = false
header_color = "reset"
prefix_padding = 7         # align command descriptions
prefix_color = "yellow"
description_color = "reset"
prompt_sign = "/ "
placeholder = ""
selection_prefix = "▌ "
inverse_selection = true

# ── apps (fsel) ────────────────────────────────────────────────
# Keep unbind_proc off for these; -d detaches GUI apps so they
# survive the launcher window closing.

[[modules]]
description = "search apps"
prefix = "s"
cmd = "tui fsel -d -r -ss \"{}\""
with_argument = true

[[modules]]
description = "launch app directly"
prefix = "a"
cmd = "tui fsel -d -r -p \"{}\""
with_argument = true

# ── command mode ───────────────────────────────────────────────

# network

[[modules]]
description = "network config"
prefix = "net"
cmd = "tui nmrs-tui"

[[modules]]
description = "bluetooth config"
prefix = "bt"
cmd = "tui bluetui"


[[modules]]
description = "configure tailscale"
prefix = "ts"
cmd = "tui lazytailscale"

[[modules]]
description = "open music player"
prefix = "mus"
cmd = "tui musikcube"

[[modules]]
description = "flash moonlander"
prefix = "kb"
cmd = "tui zapp update"

[[modules]]
description = "audio mixer"
prefix = "vol"
cmd = "tui wiremix"

[[modules]]
description = "open agent"
prefix = "ai"
cmd = """dir="{}"; [ -n "$dir" ] || dir="$HOME"; case "$dir" in "~") dir="$HOME" ;; "~/"*) dir="$HOME/${dir#~/}" ;; esac; cd -- "$dir" && tui albedo"""
with_argument = true

[[modules]]
description = "display config"
prefix = "mon"
cmd = "setsid -f wdisplays"

[[modules]]
description = "open btop"
prefix = "stat"
cmd = "tui btop"

# ── shell control ──────────────────────────────────────────────

[[modules]]
description = "screen brightness (0–100, up/down)"
prefix = "bright"
cmd = "desktop-brightness screen {}"
with_argument = true

[[modules]]
description = "keyboard backlight (0–100, up/down)"
prefix = "kbd"
cmd = "desktop-brightness keyboard {}"
with_argument = true

[[modules]]
description = "power menu"
prefix = "power"
cmd = "power-menu"

[[modules]]
description = "toggle light/dark"
prefix = "theme"
cmd = "noctalia msg theme-mode-toggle && noctalia msg wallpaper-random"

[[modules]]
description = "randomise wallpaper"
prefix = "wall"
cmd = "noctalia msg wallpaper-random"

[[modules]]
description = "lock"
prefix = "lock"
cmd = "desktop-lock"

[[modules]]
description = "toggle do not disturb"
prefix = "dnd"
cmd = "makoctl mode -t do-not-disturb"

[[modules]]
description = "recall last notification"
prefix = "notif"
cmd = "makoctl restore"

# ── escape hatch ───────────────────────────────────────────────

[[modules]]
description = "run a shell command"
prefix = "sh"
cmd = "{}"
with_argument = true

[[modules]]
description = "learn about the prompt"
prefix = "man"
cmd = "tui less ~/nix/home/desktop/otter/man.md"
