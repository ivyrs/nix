[general]
height = 1
default_module = "s"   # unmatched input -> fsel with the text pre-filled
empty_module = "s"     # Enter on empty input -> fsel
exec_cmd = "sh -c"

[interface]
header = ""
suggestion_mode = "hint"
separator = false
header_color = "reset"
prefix_padding = 7         # align command descriptions
prefix_color = "yellow"
description_color = "reset"
prompt_sign = "/ "
placeholder = ""
selection_prefix = "▌ "
inverse_selection = true

[[modules]]
description = "search apps"
prefix = "s"
cmd = "tui fsel -d -r -ss \"{}\""
with_argument = true

[[modules]]
description = "clipboard history"
prefix = "clip"
cmd = "fsel-clipboard"

[[modules]]
description = "launch app directly"
prefix = "a"
cmd = "tui fsel -d -r -p \"{}\""
with_argument = true

# network

[[modules]]
description = "network config"
prefix = "net"
cmd = "tui nmrs-tui"

[[modules]]
description = "bluetooth config"
prefix = "bt"
cmd = "tui bluetui"

[[modules]]
description = "configure tailscale"
prefix = "ts"
cmd = "tui lazytailscale"

# media

[[modules]]
description = "open music player"
prefix = "mus"
cmd = "tui lark"

[[modules]]
description = "audio mixer"
prefix = "vol"
cmd = "tui wiremix"

[[modules]]
description = "flash moonlander"
prefix = "kb"
cmd = "tui zapp update"

[[modules]]
description = "open agent"
prefix = "ai"
cmd = """dir="{}"; [ -n "$dir" ] || dir="$HOME"; case "$dir" in "~") dir="$HOME" ;; "~/"*) dir="$HOME/${dir#~/}" ;; esac; cd -- "$dir" && tui albedo new"""
with_argument = true

[[modules]]
description = "open btop"
prefix = "stat"
cmd = "tui btop"

[[modules]]
description = "search nixwiki"
prefix = "sw"
cmd = "xdg-open https://wiki.nixos.org/w/index.php?search='{}'"
with_argument = true
url_encode = true
unbind_proc = true

[[modules]]
description = "search packages"
prefix = "sp"
cmd = "xdg-open 'https://search.nixos.org/packages?channel=26.05&query={}'"
with_argument = true
url_encode = true
unbind_proc = true

[[modules]]
description = "query dictionary"
prefix = "sd"
cmd = "xdg-open https://dictionary.cambridge.org/dictionary/english/'{}'"
with_argument = true
url_encode = true
unbind_proc = true

[[modules]]
description = "screen brightness (0–100, up/down)"
prefix = "bright"
cmd = "desktop-brightness screen {}"
with_argument = true

[[modules]]
description = "keyboard backlight (0–100, up/down)"
prefix = "kbd"
cmd = "desktop-brightness keyboard {}"
with_argument = true

[[modules]]
description = "power menu"
prefix = "power"
cmd = "power-menu"

[[modules]]
description = "toggle light/dark"
prefix = "theme"
cmd = "noctalia msg theme-mode-toggle && noctalia msg wallpaper-random"

[[modules]]
description = "randomise wallpaper"
prefix = "wall"
cmd = "noctalia msg wallpaper-random"

[[modules]]
description = "lock"
prefix = "lock"
cmd = "desktop-lock"

[[modules]]
description = "toggle do not disturb"
prefix = "dnd"
cmd = "makoctl mode -t do-not-disturb"

[[modules]]
description = "recall last notification"
prefix = "notif"
cmd = "makoctl restore"

[[modules]]
description = "run a shell command"
prefix = "sh"
cmd = "{}"
with_argument = true

[[modules]]
description = "learn about the prompt"
prefix = "man"
cmd = "tui less ~/nix/home/desktop/otter/man.md"
