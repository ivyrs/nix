set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'
set-environment -g COLORTERM "truecolor"

# Refresh SSH env vars from the attaching client so starship's ssh indicator
# doesn't stay stuck on from whenever this tmux session first started.
set -g update-environment "DISPLAY SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION SSH_CLIENT SSH_TTY WINDOWID XAUTHORITY"

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

set -g mouse on
set -g focus-events on
set -g set-clipboard on

set -g escape-time 0
set -g history-limit 50000
set -g display-panes-time 4000
set -g display-time 4000
set -g status-interval 5
set -g lock-after-time 0

set -g allow-passthrough on
set -g repeat-time 300

set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
set -g bell-action none

set -g set-titles on
set -g set-titles-string "#{session_name} - #{window_name}"

setw -g mode-keys vi
setw -g clock-mode-style 24
setw -g xterm-keys on

bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

bind | split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -r m setw -g monitor-content "foobar"

unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind -n F5 setw synchronize-panes \; display "sync #{?synchronize-panes,on,off}"
bind -n F6 kill-server

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

bind -T root F12  set prefix None \;\
  set key-table off \;\
  set status-style "fg=#6c7086" \;\
  set window-status-current-style "fg=#b4befe" \;\
  if -F '#{pane_in_mode}' 'set pane-border-status off' \;\
  set message-style "fg=#b4befe" \;\
  display "Prefix off"

bind -T off F12  set -u prefix \;\
  set -u key-table \;\
  set -u status-style \;\
  set -u window-status-current-style \;\
  set -u pane-border-status \;\
  set -u message-style \;\
  display "Prefix on"

bind -n M-c new-window -c "#{pane_current_path}"
bind -n M-n next-window
bind -n M-p previous-window
bind -n M-x confirm-before kill-pane

bind -n M-t new-session
bind -n M-w choose-tree -Zw

set -g status-left-length 100
set -g status-right-length 100
set -g status-left ""
set -g status-right "#[fg=#6c7086] %Y-%m-%d %H:%M #[fg=#cdd6f4] #S "

set -g window-status-format " #I:#W "
set -g window-status-current-format " #[fg=#b4befe]#I:#W "
set -g window-status-separator ""

set -g status-position top
set -g status-style "fg=#cdd6f4"

set -g message-style "fg=#cdd6f4"

set -g pane-border-style "fg=#585b70"
set -g pane-active-border-style "fg=#b4befe"

set -g display-panes-colour "#b4befe"
set -g display-panes-active-colour "#fab387"

set -g clock-mode-colour "#b4befe"

set -g mode-style "fg=#b4befe"

setw -g window-status-style "fg=#a6adc8"
setw -g window-status-current-style "fg=#cdd6f4"
setw -g window-status-activity-style "fg=#a6e3a1"
setw -g window-status-bell-style "fg=#f38ba8"
