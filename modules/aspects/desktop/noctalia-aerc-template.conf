# Generated noctalia theme for aerc
# This template uses noctalia's color tokens to create a cohesive aerc styleset
*.default=true
*.normal=true

default.fg={{colors.on_surface}}

error.fg={{colors.on_error_container}}
warning.fg={{colors.on_warning_container}}
success.fg={{colors.on_primary_container}}

tab.fg={{colors.on_surface_variant}}
tab.bg={{colors.surface}}
tab.selected.fg={{colors.on_surface}}
tab.selected.bg={{colors.surface_variant}}
tab.selected.bold=true

border.fg={{colors.outline}}
border.bold=true

msglist_unread.bold=true
msglist_flagged.fg={{colors.secondary}}
msglist_flagged.bold=true
msglist_result.fg={{colors.primary}}
msglist_result.bold=true
msglist_*.selected.bold=true
msglist_*.selected.bg={{colors.surface_variant}}
msglist_*.selected.fg={{colors.on_surface_variant}}
msglist_deleted.fg={{colors.outline}}

dirlist_*.selected.bold=true
dirlist_*.selected.bg={{colors.surface_variant}}
dirlist_*.selected.fg={{colors.on_surface_variant}}

statusline_default.fg={{colors.on_surface_variant}}
statusline_default.bg={{colors.surface_variant}}
statusline_error.fg={{colors.on_error_container}}
statusline_error.bold=true
statusline_success.bold=true

completion_default.selected.bg={{colors.surface_variant}}
completion_description.dim=true

part_filename.selected.fg={{colors.on_surface_variant}}
part_filename.selected.bg={{colors.surface_variant}}
part_switcher.selected.bg={{colors.surface_variant}}

part_mimetype.selected.fg={{colors.on_surface_variant}}
part_mimetype.selected.bg={{colors.surface_variant}}

selector_focused.bold=true
selector_focused.bg={{colors.surface_variant}}
selector_focused.fg={{colors.on_surface_variant}}

[viewer]
url.fg={{colors.primary}}
url.underline=true
header.bold=true
signature.dim=true
diff_meta.bold=true
diff_chunk.fg={{colors.secondary}}
diff_chunk_func.fg={{colors.secondary}}
diff_chunk_func.bold=true
diff_add.fg={{colors.primary}}
diff_del.fg={{colors.error}}
quote_1.fg={{colors.primary}}
quote_2.fg={{colors.secondary}}
quote_3.fg={{colors.tertiary}}
quote_4.fg={{colors.on_surface_variant}}
quote_x.fg={{colors.outline}}