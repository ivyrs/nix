# Generated noctalia theme for tmux
# This file is sourced by tmux.conf on noctalia hosts

# Status bar theming
set -g status-style "fg={{colors.on_surface}}"
set -g status-right "#[fg={{colors.outline}}] %Y-%m-%d %H:%M #[fg={{colors.on_surface}}] #S "

# Window status theming  
set -g window-status-format " #I:#W "
set -g window-status-current-format " #[fg={{colors.primary}}]#I:#W "
set -g window-status-separator ""

setw -g window-status-style "fg={{colors.on_surface_variant}}"
setw -g window-status-current-style "fg={{colors.on_surface}}"
setw -g window-status-activity-style "fg={{colors.secondary}}"
setw -g window-status-bell-style "fg={{colors.error}}"

# Message theming
set -g message-style "fg={{colors.on_surface}}"

# Pane border theming
set -g pane-border-style "fg={{colors.outline}}"
set -g pane-active-border-style "fg={{colors.primary}}"

# Display panes theming
set -g display-panes-colour "{{colors.primary}}"
set -g display-panes-active-colour "{{colors.secondary}}"

# Clock theming
set -g clock-mode-colour "{{colors.primary}}"

# Copy mode theming
set -g mode-style "fg={{colors.primary}}"

# Prefix off mode theming (F12 toggle)
bind -T root F12  set prefix None \;\
  set key-table off \;\
  set status-style "fg={{colors.outline}}" \;\
  set window-status-current-style "fg={{colors.primary}}" \;\
  if -F '#{pane_in_mode}' 'set pane-border-status off' \;\
  set message-style "fg={{colors.primary}}" \;\
  display "Prefix off"