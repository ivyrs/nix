# Generated noctalia theme for aerc
# This template uses noctalia's color tokens to create a cohesive aerc styleset
*.default=true
*.normal=true

default.fg={{colors.on_surface.default.hex}}

error.fg={{colors.on_error_container.default.hex}}
warning.fg={{colors.on_tertiary_container.default.hex}}
success.fg={{colors.on_primary_container.default.hex}}

tab.fg={{colors.on_surface_variant.default.hex}}
tab.bg={{colors.surface.default.hex}}
tab.selected.fg={{colors.on_surface.default.hex}}
tab.selected.bg={{colors.surface_variant.default.hex}}
tab.selected.bold=true

border.fg={{colors.outline.default.hex}}
border.bold=true

msglist_unread.bold=true
msglist_flagged.fg={{colors.secondary.default.hex}}
msglist_flagged.bold=true
msglist_result.fg={{colors.primary.default.hex}}
msglist_result.bold=true
msglist_*.selected.bold=true
msglist_*.selected.bg={{colors.surface_variant.default.hex}}
msglist_*.selected.fg={{colors.on_surface_variant.default.hex}}
msglist_deleted.fg={{colors.outline.default.hex}}

dirlist_*.selected.bold=true
dirlist_*.selected.bg={{colors.surface_variant.default.hex}}
dirlist_*.selected.fg={{colors.on_surface_variant.default.hex}}

statusline_default.fg={{colors.on_surface_variant.default.hex}}
statusline_default.bg={{colors.surface_variant.default.hex}}
statusline_error.fg={{colors.on_error_container.default.hex}}
statusline_error.bold=true
statusline_success.bold=true

completion_default.selected.bg={{colors.surface_variant.default.hex}}
completion_description.dim=true

part_filename.selected.fg={{colors.on_surface_variant.default.hex}}
part_filename.selected.bg={{colors.surface_variant.default.hex}}
part_switcher.selected.bg={{colors.surface_variant.default.hex}}

part_mimetype.selected.fg={{colors.on_surface_variant.default.hex}}
part_mimetype.selected.bg={{colors.surface_variant.default.hex}}

selector_focused.bold=true
selector_focused.bg={{colors.surface_variant.default.hex}}
selector_focused.fg={{colors.on_surface_variant.default.hex}}

[viewer]
url.fg={{colors.primary.default.hex}}
url.underline=true
header.bold=true
signature.dim=true
diff_meta.bold=true
diff_chunk.fg={{colors.secondary.default.hex}}
diff_chunk_func.fg={{colors.secondary.default.hex}}
diff_chunk_func.bold=true
diff_add.fg={{colors.primary.default.hex}}
diff_del.fg={{colors.error.default.hex}}
quote_1.fg={{colors.primary.default.hex}}
quote_2.fg={{colors.secondary.default.hex}}
quote_3.fg={{colors.tertiary.default.hex}}
quote_4.fg={{colors.on_surface_variant.default.hex}}
quote_x.fg={{colors.outline.default.hex}}