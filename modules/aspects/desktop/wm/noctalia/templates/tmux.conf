# Generated noctalia theme for tmux
# This file is sourced by tmux.conf on noctalia hosts

# Status bar theming
set -g status-style "fg={{colors.on_surface.default.hex}}"
set -g status-right "#[fg={{colors.outline.default.hex}}] %Y-%m-%d %H:%M #[fg={{colors.on_surface.default.hex}}] #S "

# Window status theming  
set -g window-status-format " #I:#W "
set -g window-status-current-format " #[fg={{colors.primary.default.hex}}]#I:#W "
set -g window-status-separator ""

setw -g window-status-style "fg={{colors.on_surface_variant.default.hex}}"
setw -g window-status-current-style "fg={{colors.on_surface.default.hex}}"
setw -g window-status-activity-style "fg={{colors.secondary.default.hex}}"
setw -g window-status-bell-style "fg={{colors.error.default.hex}}"

# Message theming
set -g message-style "fg={{colors.on_surface.default.hex}}"

# Pane border theming
set -g pane-border-style "fg={{colors.outline.default.hex}}"
set -g pane-active-border-style "fg={{colors.primary.default.hex}}"

# Display panes theming
set -g display-panes-colour "{{colors.primary.default.hex}}"
set -g display-panes-active-colour "{{colors.secondary.default.hex}}"

# Clock theming
set -g clock-mode-colour "{{colors.primary.default.hex}}"

# Copy mode theming
set -g mode-style "fg={{colors.primary.default.hex}}"

# Prefix off mode theming (F12 toggle)
bind -T root F12  set prefix None \;\
  set key-table off \;\
  set status-style "fg={{colors.outline.default.hex}}" \;\
  set window-status-current-style "fg={{colors.primary.default.hex}}" \;\
  if -F '#{pane_in_mode}' 'set pane-border-status off' \;\
  set message-style "fg={{colors.primary.default.hex}}" \;\
  display "Prefix off"